<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Convertidor de temperatura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-body text-center p-5">
                        <h2 class="card-title mb-4 fw-bold" style="color: var(morado-texto);">Conversor de temperatura</h2>
                        
                        <button id="btnIniciar" class="btn btn-purple btn-lg px-5">Iniciar
                        </button>

                        <div id="resultados" class="mt-4 d-none">
                            <div class="alert alert-purple">
                                <p id="resKelvin" class="h5 mb-2"></p>
                                <p id="resFahrenheit" class="h5 mb-0"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
